# ====================================================================
# render.yaml — HealthChat Application (Render Blueprint)
# ====================================================================
# INSTRUCTIONS:
# 1. Deploy services in this ORDER: ai-service first, then server, then client
# 2. After deploying ai-service & server, copy their URLs
# 3. Set the environment variables below with real URLs in Render dashboard
#
# SECRET VARS (sync: false) — Must add these manually in Render dashboard:
#   GROQ_API_KEY       → Google AI Studio: https://aistudio.google.com/apikey
#   JWT_SECRET           → Any random 64-char string
#   MONGODB_URI          → MongoDB Atlas free cluster URI
#   CLOUDINARY_*         → Cloudinary dashboard credentials
# ====================================================================

services:

  # ── STEP 1: Deploy this first ─────────────────────────────────
  - type: web
    name: healthchat-ai
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false

  # ── STEP 2: Deploy after ai-service — set AI_SERVICE_URL first ─
  - type: web
    name: healthchat-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ↓ After deploying ai-service, paste its URL here:
      # e.g. https://healthchat-ai.onrender.com
      - key: AI_SERVICE_URL
        sync: false
      # ↓ After deploying client, paste its URL here:
      # e.g. https://healthchat-client.onrender.com
      - key: CLIENT_URL
        sync: false
      # ↓ This service's own URL (for self-ping keep-alive)
      - key: SERVER_URL
        sync: false

  # ── STEP 3: Deploy last — set REACT_APP_* vars first ──────────
  - type: web
    name: healthchat-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # ↓ After deploying server, paste its URL + /api
      # e.g. https://healthchat-server.onrender.com/api
      - key: REACT_APP_API_URL
        sync: false
      # ↓ Server URL without /api (for Socket.io)
      # e.g. https://healthchat-server.onrender.com
      - key: REACT_APP_SOCKET_URL
        sync: false