# ====================================================================
# render.yaml — HealthChat Application (Render Blueprint)
# ====================================================================
# DEPLOY ORDER:
#   1. healthchat-ai    (Python FastAPI)
#   2. healthchat-server (Node.js)
#   3. healthchat-client (React Static)
#
# REQUIRED SECRETS — add manually in Render Dashboard > Environment:
#   GEMINI_API_KEY   → https://aistudio.google.com/apikey
#   JWT_SECRET       → any random 64-char string
#   MONGODB_URI      → MongoDB Atlas free cluster URI
#   CLOUDINARY_*     → Cloudinary dashboard
# ====================================================================

services:

  # ── STEP 1: AI Service (Python FastAPI + Gemini) ──────────────────
  - type: web
    name: healthchat-ai
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  # ── STEP 2: Node.js Server ────────────────────────────────────────
  - type: web
    name: healthchat-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Paste ai-service URL after deploying STEP 1
      # e.g. https://healthchat-ai.onrender.com
      - key: AI_SERVICE_URL
        sync: false
      # Paste client URL after deploying STEP 3
      # e.g. https://healthchat-client.onrender.com
      - key: CLIENT_URL
        sync: false
      # This server's own URL (for keep-alive self-ping)
      # e.g. https://healthchat-server.onrender.com
      - key: SERVER_URL
        sync: false

  # ── STEP 3: React Client (Static Site) ───────────────────────────
  - type: web
    name: healthchat-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Paste server URL + /api after deploying STEP 2
      # e.g. https://healthchat-server.onrender.com/api
      - key: REACT_APP_API_URL
        sync: false
      # Server URL without /api (Socket.io)
      # e.g. https://healthchat-server.onrender.com
      - key: REACT_APP_SOCKET_URL
        sync: false